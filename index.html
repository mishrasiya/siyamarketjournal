<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Market Journal for FMKT 256</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: black;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: black;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: black;
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            color: white;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto;
            color: white;
        }
        
        .content {
            padding: 40px;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #666;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        thead {
            background: black;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            color: white;
            border-bottom: 2px solid #666;
            white-space: nowrap;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #666;
            color: white;
        }
        
        tbody tr:hover {
            background: #1a1a1a;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .date-col {
            font-weight: 500;
            color: white;
        }
        
        .number-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: white;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .content {
                padding: 20px;
            }
            
            table {
                font-size: 0.8rem;
            }
            
            th, td {
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Market Journal</h1>
            <p>Created by Siya Mishra</p>
        </div>
        <div class="content">
            <div class="table-container">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Load and parse CSV
        fetch('/market_journal.csv')
            .then(response => response.text())
            .then(csv => {
                const lines = csv.split('\n').filter(line => line.trim());
                if (lines.length === 0) return;
                
                // Parse CSV (handling quoted fields)
                const parseCSVLine = (line) => {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    result.push(current.trim());
                    return result;
                };
                
                const headers = parseCSVLine(lines[0]);
                const thead = document.getElementById('tableHead');
                const tbody = document.getElementById('tableBody');
                
                // Create header row
                const headerRow = document.createElement('tr');
                headers.forEach(header => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    if (header.toUpperCase().includes('DATE')) {
                        th.classList.add('date-col');
                    }
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                
                // Create data rows
                for (let i = 1; i < lines.length; i++) {
                    const row = document.createElement('tr');
                    const values = parseCSVLine(lines[i]);
                    
                    headers.forEach((header, index) => {
                        const td = document.createElement('td');
                        const value = values[index] || '';
                        td.textContent = value;
                        
                        if (header.toUpperCase().includes('DATE')) {
                            td.classList.add('date-col');
                        } else if (!isNaN(value) && value !== '') {
                            td.classList.add('number-col');
                        }
                        
                        row.appendChild(td);
                    });
                    tbody.appendChild(row);
                }
            })
            .catch(error => {
                console.error('Error loading CSV:', error);
                document.getElementById('tableBody').innerHTML = 
                    '<tr><td colspan="100%" style="text-align: center; padding: 40px; color: #dc3545;">Error loading data. Please check if market_journal.csv exists.</td></tr>';
            });
    </script>
</body>
</html>
