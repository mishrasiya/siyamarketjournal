<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Journal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1f44;
            color: #f0f0f0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #142b5c;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .header {
            background: #0f2550;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffd966;
        }

        .header p {
            font-size: 1.05rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
            color: #e0e0e0;
        }

        .content {
            padding: 30px 40px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #2e4a86;
            background: #1c356f;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.95rem;
        }

        thead tr {
            background: #0f2550;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            color: #ffd966;
            border-bottom: 2px solid #2e4a86;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td {
            color: #f0f0f0;
            border-bottom: 1px solid #2e4a86;
        }

        tbody tr:hover {
            background: #2e4a86;
            transition: background 0.2s ease-in-out;
        }

        .date-col {
            font-weight: 500;
            color: #ffd966;
        }

        .number-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 20px;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 8px 6px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Market Journal</h1>
            <p>
                Personal market journal to track daily market data.<br />
                Created by Siya Mishra
            </p>
        </div>

        <div class="content">
            <div class="table-container">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        fetch('/market_journal.csv')
            .then(response => response.text())
            .then(csv => {
                const lines = csv.split('\n').filter(line => line.trim());
                if (!lines.length) return;

                const parseCSVLine = line => {
                    const result = [];
                    let current = '';
                    let inQuotes = false;

                    for (let char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    result.push(current.trim());
                    return result;
                };

                const headers = parseCSVLine(lines[0]);

                // ❌ Remove news / summary column
                const filteredHeaders = headers.filter(h =>
                    !h.toUpperCase().includes('NEWS') &&
                    !h.toUpperCase().includes('SUMMARY')
                );

                const thead = document.getElementById('tableHead');
                const tbody = document.getElementById('tableBody');

                // Render header
                const headerRow = document.createElement('tr');
                filteredHeaders.forEach(header => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    if (header.toUpperCase().includes('DATE')) {
                        th.classList.add('date-col');
                    }
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                // Render rows
                for (let i = 1; i < lines.length; i++) {
                    const row = document.createElement('tr');
                    const values = parseCSVLine(lines[i]);

                    filteredHeaders.forEach(header => {
                        const index = headers.indexOf(header);
                        const value = values[index] || '';
                        const td = document.createElement('td');
                        td.textContent = value;

                        if (header.toUpperCase().includes('DATE')) {
                            td.classList.add('date-col');
                        } else if (!isNaN(value) && value !== '') {
                            td.classList.add('number-col');
                        }

                        row.appendChild(td);
                    });

                    tbody.appendChild(row);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('tableBody').innerHTML =
                    `<tr>
                        <td colspan="100%" style="text-align:center; padding:40px; color:#ff6b6b;">
                            Error loading market_journal.csv
                        </td>
                    </tr>`;
            });
    </script>
</body>
</html>
